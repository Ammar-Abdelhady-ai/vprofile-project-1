apiVersion: apps/v1
kind: Deployment
metadata:
  name: vproapp
  labels:
    app: vproapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vproapp
  template:
    metadata:
      labels:
        app: vproapp
    spec:
      containers:
        - name: vproapp
          image: ammarabdelhady8132/vprofileapp
          ports:
            - name: vproapp-port
              containerPort: 8080
   
---
apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  type: NodePort
  selector:
    app: vproapp
  ports:
    - port: 8080
     
      targetPort: 8080
 
      nodePort: 30007
